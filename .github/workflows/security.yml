# Segredos no histórico (gitleaks). Só lê o repositório.
name: security

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (histórico completo)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Binário fixado por versão + SHA256 do release oficial (gitleaks_<v>_checksums.txt).
      # A gitleaks-action exige licença paga para repositórios de organização.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Instalar gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      - name: Varredura
        # --redact: o segredo encontrado não aparece no log do Actions.
        run: ./gitleaks git --config .gitleaks.toml --redact --no-banner --verbose .

