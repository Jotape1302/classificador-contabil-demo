# Publica o frontend em modo demonstração no GitHub Pages: API simulada no navegador,
# mesmas regras do motor Python (web/src/demo/rules.generated.ts). Sem backend.
# Requer Settings > Pages > Source = "GitHub Actions".
name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Regras da demo em dia com o motor Python
        run: |
          python3 web/scripts/gen-demo-rules.py
          git diff --exit-code -- web/src/demo/ || { echo "::error::Rode 'npm --prefix web run gen:demo' e commite."; exit 1; }
      - name: Instalar dependências
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Build demo
        working-directory: web
        run: npm run build:demo -- --base "/${{ github.event.repository.name }}/"
      - name: Fallback de rotas da SPA
        run: cp web/dist/index.html web/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: pytest
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt pytest
          pytest -q
